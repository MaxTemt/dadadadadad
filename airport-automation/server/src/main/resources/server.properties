server.host=0.0.0.0
# Порт TCP-сервера
server.port=5555
# Количество потоков обработки клиентских запросов
server.threads=16

# Параметры подключения к MySQL
db.url=jdbc:mysql://localhost:3306/airport?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=airport
db.password=airport
db.pool.size=10
db.pool.timeout.ms=10000

# Каталоги для отчётов и резервных копий
reports.dir=reports
backup.dir=backups
